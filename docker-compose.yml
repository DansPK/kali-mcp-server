services:
  kali-mcp:
    build: .
    image: kali-mcp:latest
    platform: linux/amd64
    container_name: kali-mcp
    stdin_open: true
    tty: false
    environment:
      - KALI_MCP_AUTH_TOKEN=${KALI_MCP_AUTH_TOKEN:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - kali-cache:/root/.cache
      - kali-nuclei-templates:/root/nuclei-templates

volumes:
  kali-cache:
    name: kali-mcp-cache
  kali-nuclei-templates:
    name: kali-nuclei-templates
